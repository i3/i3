[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai3-server"
version = "1.0.0"
description = "AI-powered i3wm assistant with tools and OpenAI agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ai3", email = "ai3@example.com" }
]
dependencies = [
    "openai>=1.0.0",
    "i3ipc>=2.2.1",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "Pillow>=10.0.0",
    "pyscreenshot>=3.0",
    "python-xlib>=0.33",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
ai3 = "ai3_server.cli:main"
ai3-server = "ai3_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai3_server"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
