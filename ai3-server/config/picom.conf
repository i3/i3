# Picom Configuration for ai3 - Dracula Theme
# Compositor for transparency, shadows, and visual effects

# ============================================
# BACKEND
# ============================================

# Backend to use: "xrender" or "glx".
# GLX is usually faster but requires OpenGL support
backend = "xrender";

# ============================================
# SHADOWS
# ============================================

# Enable shadows
shadow = true;

# Shadow radius (pixels)
shadow-radius = 12;

# Shadow opacity (0.0 - 1.0)
shadow-opacity = 0.75;

# Shadow offset (X and Y)
shadow-offset-x = -12;
shadow-offset-y = -12;

# Shadow color (Dracula purple tint)
shadow-color = "#1e1f29";

# Exclude shadows on certain windows
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ============================================
# FADING
# ============================================

# Enable fading
fading = true;

# Fade step (opacity change between steps)
fade-in-step = 0.03;
fade-out-step = 0.03;

# Fade time (ms)
fade-delta = 5;

# ============================================
# TRANSPARENCY / OPACITY
# ============================================

# Opacity for inactive windows
inactive-opacity = 0.9;

# Opacity for active windows
active-opacity = 1.0;

# Opacity for window frame
frame-opacity = 0.9;

# Let inactive opacity override window's own opacity setting
inactive-opacity-override = false;

# Opacity rules for specific applications
opacity-rule = [
    "90:class_g = 'XTerm'",
    "100:class_g = 'Firefox'",
    "100:class_g = 'Chromium'",
    "100:fullscreen"
];

# ============================================
# CORNERS
# ============================================

# Rounded corners radius
corner-radius = 8;

# Exclude rounded corners for certain windows
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# ============================================
# BLUR (if supported)
# ============================================

# Blur background of transparent windows
blur-background = false;

# ============================================
# GENERAL SETTINGS
# ============================================

# Try to detect WM windows and mark them as active
mark-wmwin-focused = true;

# Mark override-redirect windows as focused
mark-ovredir-focused = true;

# Try to detect windows with rounded corners and don't consider them shaped windows
detect-rounded-corners = true;

# Detect _NET_WM_OPACITY on client windows
detect-client-opacity = true;

# Use EWMH _NET_WM_ACTIVE_WINDOW to determine active window
use-ewmh-active-win = true;

# Unredirect all windows if a full-screen opaque window is detected
unredir-if-possible = false;

# Delay before unredirecting the window (ms)
unredir-if-possible-delay = 0;

# Use _NET_WM_DAMAGE_REGION to determine what needs to be updated
detect-transient = true;

# Use WM_CLIENT_LEADER to group windows
detect-client-leader = true;

# ============================================
# VSYNC
# ============================================

# Disable VSync for virtual framebuffer compatibility
vsync = false;

# ============================================
# WINDOW TYPE SETTINGS
# ============================================

wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; full-shadow = false; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.95; shadow = true; };
    dropdown_menu = { opacity = 0.95; shadow = true; };
};
