# i3status configuration for ai3
# Displays system info in the i3bar (AI stats are native in i3bar)

general {
    output_format = "i3bar"
    colors = true
    color_good = "#50fa7b"
    color_degraded = "#f1fa8c"
    color_bad = "#ff5555"
    interval = 2
}

# Order of display (AI blocks are injected natively by i3bar)
order += "cpu_usage"
order += "memory"
order += "disk /"
order += "tztime local"

# CPU usage
cpu_usage {
    format = "CPU: %usage"
    degraded_threshold = 80
    max_threshold = 95
}

# Memory usage
memory {
    format = "MEM: %percentage_used"
    threshold_degraded = "70%"
    threshold_critical = "90%"
}

# Disk space
disk "/" {
    format = "DISK: %percentage_used"
    low_threshold = 10
    threshold_type = "percentage_free"
}

# Time - plain text, no pango markup
tztime local {
    format = "%H:%M %Y-%m-%d"
}
